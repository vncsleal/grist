pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --verbose
      skip: true
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
commit-msg:
  commands:
    conventional-commit:
      run: |
        echo "{1}" | grep -qE '^(feat|fix|docs|refactor|test|chore|perf|ci|revert)(\(.+\))?: .+$'
      skip: true
