# Gitleaks configuration for Quillby
# Docs: https://github.com/gitleaks/gitleaks

title = "Quillby gitleaks config"

[allowlist]
  description = "Known safe files and paths"
  paths = [
    # Lockfiles with hashes
    "(^|/)pnpm-lock\\.yaml$",
    "(^|/)package-lock\\.json$",
    # IDE config
    "(^|/)\\.cursor/",
    "(^|/)\\.opencode/",
    # Example env files
    "(^|/)\\.env\\.example$",
  ]
